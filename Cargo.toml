[package]
name = "solana_transfers"
version = "0.1.0"
edition = "2021"
description = "Substreams module extracting SOL and SPL token transfers from Solana blocks"

[lib]
crate-type = ["cdylib"]

[dependencies]
prost = "0.13"
substreams = "0.7.6"
substreams-solana = "0.15.1"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
